# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Gemini Copilot Window Rules
windowrule = match:title ^(Gemini-Copilot)$, float on
windowrule = match:title ^(Gemini-Copilot)$, center on
windowrule = match:title ^(Gemini-Copilot)$, size 800 600
windowrule = match:title ^(Gemini-Copilot)$, opacity 0.95 0.95
windowrule = match:title ^(Gemini-Copilot)$, pin on
windowrule = match:title ^(Gemini-Copilot)$, workspace special:gemini silent

# btop Window Rules
windowrule = match:title ^(btop-float)$, float on
windowrule = match:title ^(btop-float)$, center on
windowrule = match:title ^(btop-float)$, size 1000 700
windowrule = match:title ^(btop-float)$, opacity 0.95 0.95
windowrule = match:title ^(btop-float)$, pin on
windowrule = match:title ^(btop-float)$, workspace special:btop silent
